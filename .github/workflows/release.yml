name: release

# 方案 C：CI 构建镜像推 GHCR。
#   push 到 main → :main + :sha-<短hash>（edge 通道）
#   push v* tag  → :v<版本> + :latest，并创建 GitHub Release（在线更新走这个通道）
on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write   # 创建 GitHub Release
  packages: write   # 推送 GHCR 镜像

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 计算版本与镜像 tag
        id: vars
        run: |
          COMMIT="$(git rev-parse HEAD)"
          SHORT="$(git rev-parse --short HEAD)"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="$GITHUB_REF_NAME"
            TAGS="${{ env.IMAGE }}:$GITHUB_REF_NAME,${{ env.IMAGE }}:latest"
          else
            VERSION="main-$SHORT"
            TAGS="${{ env.IMAGE }}:main,${{ env.IMAGE }}:sha-$SHORT"
          fi
          {
            echo "version=$VERSION"
            echo "commit=$COMMIT"
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.vars.outputs.tags }}
          build-args: |
            APP_VERSION=${{ steps.vars.outputs.version }}
            APP_COMMIT=${{ steps.vars.outputs.commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 创建 GitHub Release（仅 tag）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
